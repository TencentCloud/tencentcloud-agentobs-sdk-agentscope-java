name: Maven Package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Build and prepare bundle (no upload)
      run: mvn --batch-mode clean verify -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}"
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}

    - name: Inspect target directory
      run: |
        echo "=== target directory structure ==="
        find target -type f 2>/dev/null | grep -v classes | grep -v test-classes | sort

    - name: Publish package
      run: mvn --batch-mode deploy -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" -DskipTests
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}

    - name: Inspect bundle contents (after publish attempt)
      if: always()
      run: |
        echo "=== central-publishing directory structure ==="
        find target/central-publishing -type f 2>/dev/null | sort || echo "No central-publishing directory"
        echo ""
        echo "=== Bundle zip contents ==="
        if [ -f target/central-publishing/central-bundle.zip ]; then
          unzip -l target/central-publishing/central-bundle.zip
        else
          echo "No bundle zip found"
        fi

    - name: Publish package
      run: mvn --batch-mode deploy -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" -DskipTests
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
