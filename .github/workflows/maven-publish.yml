name: Maven Package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Publish package
      run: |
        mvn --batch-mode clean deploy \
          -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
          -DskipTests \
          -Daether.generatedMetadata.skip=true \
          -Daether.artifactResolver.trackingFile.enabled=false
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}

    - name: Inspect bundle contents on failure
      if: failure()
      run: |
        echo "=== Bundle zip contents ==="
        if [ -f target/central-publishing/central-bundle.zip ]; then
          unzip -l target/central-publishing/central-bundle.zip
        else
          echo "No bundle zip found"
        fi

    - name: Clean bundle and republish on first failure
      if: failure()
      run: |
        echo "=== Attempting to clean bundle and republish ==="
        # 清理 central-staging 中的脏文件
        if [ -d target/central-staging ]; then
          find target/central-staging -name "_remote.repositories*" -delete
          find target/central-staging -name "maven-metadata-local.xml*" -delete
          echo "Cleaned staging dir, files remaining:"
          find target/central-staging -type f
        fi