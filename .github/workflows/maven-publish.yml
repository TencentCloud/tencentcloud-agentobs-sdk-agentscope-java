name: Maven Package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Build, sign and stage (skip publishing)
      run: |
        mvn --batch-mode clean deploy \
          -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
          -DskipTests \
          -DskipPublishing=true
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}

    - name: Clean dirty files and rebuild bundle
      run: |
        echo "=== Before cleanup ==="
        find target/central-staging -type f | sort
        echo ""
        echo "=== Cleaning dirty files (_remote.repositories, maven-metadata-local.xml) ==="
        find target/central-staging -name "_remote.repositories*" -delete
        find target/central-staging -name "maven-metadata-local.xml*" -delete
        find target/central-staging -name "maven-metadata.xml*" -delete
        echo ""
        echo "=== After cleanup ==="
        find target/central-staging -type f | sort
        echo ""
        echo "=== Rebuilding clean central-bundle.zip ==="
        rm -f target/central-publishing/central-bundle.zip
        rm -f target/central-staging/central-bundle.zip
        mkdir -p target/central-publishing
        cd target/central-staging
        zip -r ../central-publishing/central-bundle.zip com
        cd ../..
        echo ""
        echo "=== Final bundle contents ==="
        unzip -l target/central-publishing/central-bundle.zip

    - name: Upload bundle to Central Portal
      run: |
        BEARER_TOKEN=$(printf "%s:%s" "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 -w0)
        HTTP_CODE=$(curl --silent --output /tmp/upload_response.txt --write-out "%{http_code}" \
          --request POST \
          --header "Authorization: Bearer ${BEARER_TOKEN}" \
          --form bundle=@target/central-publishing/central-bundle.zip \
          "https://central.sonatype.com/api/v1/publisher/upload?name=tencentcloud-agentobs-sdk-agentscope-java-0.0.2&publishingType=AUTOMATIC")
        echo "HTTP response code: ${HTTP_CODE}"
        echo "Response body:"
        cat /tmp/upload_response.txt
        echo ""
        if [ "${HTTP_CODE}" != "201" ] && [ "${HTTP_CODE}" != "200" ]; then
          echo "Upload failed with HTTP ${HTTP_CODE}"
          exit 1
        fi
        DEPLOYMENT_ID=$(cat /tmp/upload_response.txt | tr -d '"')
        echo "Deployment ID: ${DEPLOYMENT_ID}"
        echo "Deployment uploaded successfully. Central Portal will auto-publish."
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}